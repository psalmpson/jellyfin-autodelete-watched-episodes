name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.WatchedDeleter/Jellyfin.Plugin.WatchedDeleter.csproj -c Release -o artifacts

      - name: Upload plugin dll
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.WatchedDeleter
          path: |
            artifacts/Jellyfin.Plugin.WatchedDeleter.dll
            artifacts/Jellyfin.Plugin.WatchedDeleter.pdb
