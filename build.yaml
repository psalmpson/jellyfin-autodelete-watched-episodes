name: "Auto Delete Watched Episodes"
guid: "9386bc33-7cb3-4303-802a-c7f53827022f"
version: "1.0.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Automatically delete episodes a while after they were watched."
description: >-
  Deletes episodes from the libraries you select once they have been watched and the configured
  delay (for example 24 hours) has passed. Series and seasons that no longer contain any episodes
  are removed as well. Includes a dry run mode that only logs what would be deleted.
category: "General"
owner: "your-github-username"
artifacts:
